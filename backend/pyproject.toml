[project]
name = "nasdeck-backend"
version = "dev-0.0.18"
description = "nasdeck 飞牛 fnOS 硬件监控面板 · FastAPI 后端（/api/v1 六域 + WS）"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "apscheduler>=3.10,<4",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "psutil>=5.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"] # FastAPI Depends() 默认参数模式

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
