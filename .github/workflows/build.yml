name: Build nasdeck fpk

# 默认分支是 main（origin/HEAD 已核实）；PR 与手动触发同走此流程。
# 注意：frontend/package.json 没有 typecheck/test 脚本，前端只做 lint + build；
# fpk 打包走 scripts/build_fpk.py（旧模板里的 build.sh/app.py 均不存在）。
#
# 双架构：test 先跑 lint + 单元（L2），package 用 matrix 分别打 x86 / arm 两个包，
# 每个包在打包末尾做 L1 结构校验（build_fpk.py verify_fpk），各自上传 artifact。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # pnpm 版本读 frontend/package.json 的 packageManager 字段
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint (eslint)
        working-directory: frontend
        run: pnpm lint

      # 前端必须在 CI 从源码重建：避免「改了 frontend/src 忘了重新构建就提交」
      # 导致 fpk 带过期前端
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: Backend lint (ruff)
        run: |
          python3 -m pip install -q ruff
          python3 -m ruff check backend

      - name: Backend sanity (compileall + pytest)
        run: |
          python3 -m compileall -q backend/app backend/main.py
          python3 -c "import tomllib; deps = tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['dependencies']; open('requirements-ci.txt', 'w').write('\n'.join(deps) + '\n')"
          python3 -m pip install -q -r requirements-ci.txt pytest pytest-asyncio
          (cd backend && python3 -m pytest -q)

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86, arm ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # 交叉下载只取目标架构的轮子，不装到本机；pip 版本要够新才支持 --platform 组合
      - name: Upgrade pip
        run: python3 -m pip install --upgrade pip

      # fpk 组装 + 校验 + 打包（--skip-fnpack-download：CI 为 Linux，跳过 Windows 版 fnpack）
      # 打包末尾自动做 L1 结构校验：platform / wheel Tag / ELF e_machine / ARM 无 storcli
      - name: Build fpk (${{ matrix.arch }})
        run: |
          python3 scripts/build_fpk.py --arch ${{ matrix.arch }} --skip-frontend --skip-fnpack-download \
            --python "$(command -v python3)"

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasdeck-fpk-${{ matrix.arch }}
          path: build/fpk/nasdeck_${{ matrix.arch }}-fnpack-*.fpk
          if-no-files-found: error

  # L3：aarch64 用户态模拟验收。结构对了不等于能用——这里在 arm64 容器里真起后端，
  # 验证依赖 import、DB 初始化、核心接口有数据、架构画像为 aarch64。
  acceptance-arm:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 user-mode emulation)
        uses: docker/setup-qemu-action@v3

      - name: Download arm fpk
        uses: actions/download-artifact@v4
        with:
          name: nasdeck-fpk-arm
          path: build/fpk

      - name: L3 acceptance (aarch64)
        run: bash scripts/acceptance_arm.sh "$(ls build/fpk/nasdeck_arm-*.fpk | head -1)" build/fpk/acceptance-report.md

      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: build/fpk/acceptance-report.md
          if-no-files-found: error
