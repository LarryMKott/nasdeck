name: Release nasdeck fpk

# 发版流程（版本号唯一来源是 backend/pyproject.toml，构建时注入 fpk/manifest 的 @VERSION@）：
#   改 backend/pyproject.toml 的 version → git tag <版本> && git push origin <版本>
#   → 本 workflow 构建标准 FPK（build/fpk/nasdeck-fnpack-<版本>.fpk）并自动创建 GitHub Release 挂上产物
on:
  push:
    tags: [ 'v*', 'dev-*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tag 必须与 pyproject 版本一致，防止版本号漏改就打 tag 发出错版包
      - name: Verify tag matches pyproject version
        run: |
          python3 - <<'PY'
          import os, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          ver = tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version']
          assert tag == ver, f"tag {tag} 与 backend/pyproject.toml 版本 {ver} 不一致 —— 请先改版本号再打 tag"
          print(f"OK: tag {tag} == pyproject {ver}")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Backend sanity (compileall + pytest)
        run: |
          python3 -m compileall -q backend/app backend/main.py
          python3 -c "import tomllib; deps = tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['dependencies']; open('requirements-ci.txt', 'w').write('\n'.join(deps) + '\n')"
          python3 -m pip install -q -r requirements-ci.txt pytest pytest-asyncio
          (cd backend && python3 -m pytest -q)

      # 手工打包器显式设置可执行位，产物结构与官方 fnpack 一致；--skip-fnpack-download 跳过 Windows 版 fnpack
      - name: Build release fpk（前端 fpk 模式构建 + 离线 wheels 装配 + fnpack 同等校验）
        run: |
          python3 scripts/build_fpk.py --skip-fnpack-download --python "$(command -v python3)"

      # 发布说明取 fpk/manifest 的 changelog 中当前版本对应段落
      # （格式：`changelog = ver1: 说明; ver2: 说明; …`，整行连发会带出全部历史版本）
      - name: Release notes
        run: |
          python3 - <<'PY'
          import os, re
          ver = os.environ['GITHUB_REF_NAME']
          m = re.search(r'^changelog\s*=\s*(.+)$', open('fpk/manifest', encoding='utf-8').read(), re.M)
          body = ''
          if m:
              for seg in m.group(1).split(';'):
                  seg = seg.strip()
                  if seg.startswith(f'{ver}:'):
                      body = seg[len(ver) + 1:].strip()
                      break
          if not body:
              body = '开发版。'
          notes = (f"nasdeck {ver}\n\n{body}\n\n---\n\n"
                   "安装：飞牛 fnOS 应用中心 → 手动安装 → 选择本 fpk（官方注明仅限本地测试），详见 README。")
          path = os.path.join(os.environ['RUNNER_TEMP'], 'release-notes.md')
          open(path, 'w', encoding='utf-8').write(notes)
          print(notes)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: nasdeck ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: build/fpk/nasdeck-fnpack-*.fpk
          fail_on_unmatched_files: true
